[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnviz-live"
version = "0.1.0"
description = "Live neural-network training visualiser for PyTorch"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Shriraj", email = "shrirajkun@gmail.com" }
]
keywords = [
    "pytorch",
    "neural-network",
    "visualization",
    "deep-learning",
    "training",
    "pygame",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=1.10",
    "numpy>=1.21",
    "pygame>=2.1",
]

[project.optional-dependencies]
examples = [
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/kazuma761/nnviz-live"
Repository = "https://github.com/kazuma761/nnviz-live"
Issues = "https://github.com/kazuma761/nnviz-live/issues"

[tool.setuptools]
packages = ["nnviz"]